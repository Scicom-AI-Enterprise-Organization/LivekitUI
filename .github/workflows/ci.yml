# CI — check the app, then build the LivekitUI image (multi-arch) and push to ECR.
#
# Pattern follows Serverless-GPU's ci.yml (org convention):
#   - Native runners per architecture (ubuntu-latest for amd64,
#     ubuntu-24.04-arm for arm64) — no QEMU emulation. This image installs
#     Node deps AND a Python venv with livekit plugins; under QEMU the arm64
#     leg would take 40+ minutes, natively both legs run in parallel.
#   - Each leg pushes a per-platform tag (<tag>-amd64 / <tag>-arm64); the
#     merge job stitches them into one multi-arch manifest.
#   - GitHub OIDC -> IAM role. NO long-lived AWS keys in secrets.
#   - GHA layer cache, scoped per arch so the legs don't evict each other.
#
# WHAT RUNS WHEN
#   pull request -> checks only (typecheck, unit tests, lint ratchet, next
#                   build). One small runner, a couple of minutes.
#   push a vX.Y.Z tag  -> checks, then the multi-arch image build and push:
#                         image tags X.Y.Z + latest, for argocd-image-updater
#                         updateStrategy: semver.
#   push to a branch (main included) -> nothing.
#
# Nothing runs on a branch push by design: `on.push` lists tags only. Work that
# should be verified goes through a PR, and a release is a tag. A commit pushed
# straight to main is therefore unverified until one or the other — if you want
# it checked without opening a PR, tag it or run `npm run build && npm test`
# locally.
#
# The image build is deliberately NOT on main either. It occupies two runners
# for ~20 min a go, and paying that to publish a main-<sha7> tag nothing
# deploys from is waste. Cut a release with ./release.sh.
#
# The tradeoff: a Dockerfile that no longer builds now surfaces when you tag,
# not on the PR that broke it. `checks` still runs `next build` on every PR,
# so app-level breakage is caught there — it is the container layers (apt, pip,
# the sandbox npm ci legs) that go unverified until release.
#
# Setup required before first push (see PR description / runbook):
#   - IAM role with ECR push policy + OIDC trust for this repo; its ARN in
#     the repo SECRET ECR_ROLE_ARN.
#   - Repo VARIABLE ENABLE_ECR_PUSH=true (kill-switch, same as sgpu).
#   - ECR repository scicom/livekitui must exist.
# No NEXT_PUBLIC_* variables are needed: the image carries no deployment
# addresses, they are read at runtime (src/lib/runtime-config.ts). The one value
# that *is* baked in is APP_VERSION — the release plus the commit, shown in the
# sidebar footer. It has to be a build arg: `.git` is dockerignored, so the
# container has no repository to ask.
name: CI

on:
  push:
    # Tags only — no `branches:` key, so a push to main (or any branch) runs
    # nothing. Adding `branches: [main]` back would restore checks on every
    # main push; see WHAT RUNS WHEN above before doing that.
    tags: ["v*.*.*"] # semver releases: v1.2.3 -> image tags 1.2.3 + latest
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write # OIDC federation to AWS — this replaces AWS keys

env:
  AWS_REGION: ap-southeast-5
  ECR_REGISTRY: 865626945255.dkr.ecr.ap-southeast-5.amazonaws.com
  ECR_REPO: scicom/livekitui

  # Match the runtime image (Dockerfile is node:24-bookworm-slim). Not just
  # tidiness: tests/openapi.test.mjs imports src/lib/openapi.ts directly, which
  # needs the unflagged TypeScript type stripping that landed in Node 23.6.
  NODE_VERSION: "24"

  # The repo has pre-existing lint errors in older pages (see CLAUDE.md), so
  # lint is a ratchet, not a clean gate: CI fails only when the count goes UP.
  # Measured on the CI-visible tree — data/ is gitignored and holds ~348 more
  # errors in generated sandbox code that never reaches a checkout.
  # To lower it after a cleanup, run `npx eslint -f json` and count errorCount.
  LINT_ERROR_BASELINE: "59"

jobs:
  # ── Decide once whether this run pushes, and compute the tag ──────────────
  # Only reached on a tag: `build` gates on github.ref_type, so meta never has
  # a branch case to consider. ENABLE_ECR_PUSH remains the kill-switch — with
  # it off a tag still builds both arches (proving the Dockerfile) but
  # publishes nothing.
  meta:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    outputs:
      push: ${{ steps.d.outputs.push }}
      # Image tag: semver with the v- prefix stripped (v1.2.3 -> 1.2.3).
      img_tag: ${{ steps.d.outputs.img_tag }}
      # Baked into the image and shown in the sidebar footer. The release *and*
      # the commit: the tag says which version was cut, the sha says exactly
      # what is in the running container — which is the question you actually
      # have when a deployed instance behaves unlike the tree in front of you.
      app_version: ${{ steps.d.outputs.app_version }}
    steps:
      - id: d
        run: |
          TAG=$(echo '${{ github.ref_name }}' | sed 's/^v//')
          echo "img_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "app_version=${TAG}+${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          if [ "${{ vars.ENABLE_ECR_PUSH }}" = "true" ]; then
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi

  # ── Static gate: typecheck, unit tests, lint ratchet, build ───────────────
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        # --incremental false because tsconfig.tsbuildinfo is committed: a stale
        # one would let tsc skip files it has already "seen" and report clean.
        run: npx tsc --noEmit --incremental false

      - name: Unit tests
        # `npm test` globs tests/**, but most of that suite is integration
        # tests that drive the REST API of a *running* dashboard (see
        # tests/helpers.mjs) and need TEST_EMAIL/TEST_PASSWORD. Only these two
        # are self-contained; the rest need a deployed stack, not a CI runner.
        run: node --test tests/wav-mixer.test.mjs tests/openapi.test.mjs

      - name: Lint (ratchet against LINT_ERROR_BASELINE)
        run: |
          set -uo pipefail
          # eslint exits non-zero when it finds errors — that is the normal case
          # here, so read the JSON report instead of trusting the exit code.
          npx eslint -f json -o eslint-report.json || true
          if [ ! -f eslint-report.json ]; then
            echo "::error::eslint produced no report — it likely crashed"
            exit 1
          fi
          ERRORS=$(node -e 'console.log(require("./eslint-report.json").reduce((a,f)=>a+f.errorCount,0))')
          WARNINGS=$(node -e 'console.log(require("./eslint-report.json").reduce((a,f)=>a+f.warningCount,0))')
          echo "eslint: $ERRORS errors, $WARNINGS warnings (baseline $LINT_ERROR_BASELINE errors)"
          {
            echo "## Lint"
            echo "\`$ERRORS\` errors / \`$WARNINGS\` warnings — baseline \`$LINT_ERROR_BASELINE\` errors"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$ERRORS" -gt "$LINT_ERROR_BASELINE" ]; then
            echo "::error::Lint errors went up: $ERRORS > $LINT_ERROR_BASELINE"
            # Print every error from the report we already have rather than
            # paying for a second full eslint run.
            node -e '
              for (const f of require("./eslint-report.json")) {
                for (const m of f.messages.filter((m) => m.severity === 2)) {
                  const p = f.filePath.replace(process.cwd() + "/", "");
                  console.log(`${p}:${m.line}:${m.column}  ${m.message}  (${m.ruleId})`);
                }
              }
            '
            exit 1
          fi
          if [ "$ERRORS" -lt "$LINT_ERROR_BASELINE" ]; then
            echo "::notice::Lint errors are down to $ERRORS — lower LINT_ERROR_BASELINE in .github/workflows/ci.yml to lock the win in."
          fi

      - name: Build
        # `next build` catches App Router constraints tsc misses (e.g. a page
        # exporting anything but a default component) and type-checks the route
        # types under .next/types that do not exist before a build.
        run: npm run build

  # ── Build one image per architecture on its native runner ─────────────────
  build:
    name: build (${{ matrix.suffix }})
    needs: [meta, checks]
    if: github.ref_type == 'tag'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    # The image carries no deployment addresses. LIVEKIT_PUBLIC_URL and friends
    # are read at runtime (src/lib/runtime-config.ts), so they belong on the
    # deployed container, not on this build.
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            suffix: arm64
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials (GitHub OIDC)
        if: needs.meta.outputs.push == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.ECR_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-LivekitUI

      - name: Login to ECR (private)
        if: needs.meta.outputs.push == 'true'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & maybe push (${{ matrix.platform }})
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          # The one thing this build stamps in. Its `ARG` sits after `npm run
          # build` in the Dockerfile, so a value that changes every commit
          # invalidates only the trailing ENV layers — keep it there, or every
          # release repays the apt/pip/npm layers from scratch.
          build-args: |
            APP_VERSION=${{ needs.meta.outputs.app_version }}
          # False only when ENABLE_ECR_PUSH is off — the build still runs, so
          # the kill-switch proves the Dockerfile without publishing.
          push: ${{ needs.meta.outputs.push == 'true' }}
          tags: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:${{ needs.meta.outputs.img_tag }}-${{ matrix.suffix }}
          # Layer cache in the GHA cache backend, one scope per arch. The
          # pip-install and npm layers dominate build time; warm-cache runs
          # skip both unless the corresponding layer inputs changed.
          cache-from: type=gha,scope=livekitui-${{ matrix.suffix }}
          cache-to: type=gha,scope=livekitui-${{ matrix.suffix }},mode=max
          provenance: false

  # ── Stitch the per-arch images into one multi-arch manifest ───────────────
  merge:
    name: merge manifest
    needs: [meta, build]
    if: needs.meta.outputs.push == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials (GitHub OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.ECR_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-LivekitUI

      - name: Login to ECR (private)
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create and push multi-arch manifest
        run: |
          set -euo pipefail
          IMAGE="${ECR_REGISTRY}/${ECR_REPO}"
          TAG="${{ needs.meta.outputs.img_tag }}"
          docker buildx imagetools create \
            --tag "${IMAGE}:${TAG}" \
            --tag "${IMAGE}:latest" \
            "${IMAGE}:${TAG}-amd64" \
            "${IMAGE}:${TAG}-arm64"
          docker buildx imagetools inspect "${IMAGE}:${TAG}"
          {
            echo "## Pushed image"
            echo "**Image:** \`${IMAGE}:${TAG}\` (also tagged \`latest\`)"
          } >> "$GITHUB_STEP_SUMMARY"
